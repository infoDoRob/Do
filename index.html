<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do - نظام الرصد الميداني</title>
    
    <!-- 1️⃣ روابط مكتبة الخرائط Leaflet المحدثة -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    
    <!-- 2️⃣ رابط مكتبة Supabase -->
    <script src="https://jsdelivr.net"></script>

    <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; background: #161616; overflow: hidden; font-family: sans-serif; }
        .report-btn { transition: all 0.2s; cursor: pointer; border: none; font-weight: 900; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .report-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="inviteOverlay" style="position: fixed; inset: 0; z-index: 99999; background: #161616; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; direction: rtl;">
        <div style="width: 100%; max-width: 400px; background: #1d1d1d; border: 1px solid rgba(0,229,255,0.2); padding: 30px; border-radius: 24px; text-align: center;">
            <h1 style="font-size: 24px; font-weight: 900; color: #00E5FF; margin-bottom: 5px;">Do</h1>
            <p style="font-size: 12px; color: #a0aec0; margin-bottom: 25px;">نسخة رصد ميدانية مغلقة - كود الدعوة فقط</p>
            <input type="text" id="inviteCodeInput" placeholder="ENTER CODE" style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #4a5568; border-radius: 12px; padding: 12px; text-align: center; color: #00E5FF; font-weight: bold; text-transform: uppercase;">
            <button onclick="verifyInvitation()" style="width: 100%; background: #00E5FF; border: none; font-weight: 900; padding: 14px; border-radius: 12px; margin-top: 15px; cursor: pointer; color: black;">🔓 تفعيل التطبيق</button>
        </div>
    </div>
    <div id="map"></div>
    <div id="reportPanel" style="position: absolute; top: 20px; left: 20px; right: 20px; z-index: 9999; display: none; flex-direction: column; gap: 10px;">
        <div style="background: rgba(29,29,29,0.9); border: 1px solid rgba(0,229,255,0.3); padding: 10px 20px; border-radius: 999px; display: flex; justify-content: space-between; align-items: center;">
            <span id="driverBadge" style="font-size: 12px; color: #00E5FF; font-weight: 900;">👤 راصد</span>
            <span style="font-size: 12px; color: #FFD700; font-weight: 900;">🪙 النقاط: <span id="pointsCounter">0</span></span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button onclick="sendReportToServer('📷 كاميرا سرعة')" class="report-btn" style="background: #FF1E56; color: white; padding: 14px; font-size: 12px;">📷 كاميرا سرعة</button>
            <button onclick="sendReportToServer('🚗 ازدحام مروري')" class="report-btn" style="background: #FF5A1F; color: white; padding: 14px; font-size: 12px;">🚗 ازدحام مروري</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
            <button onclick="sendReportToServer('🚧 تحويل مروري')" class="report-btn" style="background: #FFD700; color: black; padding: 12px; font-size: 11px;">🚧 تحويل</button>
            <button onclick="sendReportToServer('💥 حادث سير')" class="report-btn" style="background: #d97706; color: white; padding: 12px; font-size: 11px;">💥 حادث</button>
            <button onclick="sendReportToServer('⚠️ خطر بالطريق')" class="report-btn" style="background: #dc2626; color: white; padding: 12px; font-size: 11px;">⚠️ خطر</button>
        </div>
    </div>
    <script>
        let map; let activeDriverCode = ""; let localPoints = 0;
        
        // 3️⃣ تم استبدال النطاق والمفتاح ببياناتك العامة لحماية أمن تطبيقك
        const supabaseUrl = 'https://supabase.co'; // تم بناؤه تلقائياً بناءً على رمز مشروعك
        const supabaseAnonKey = 'sb_publishable_Prk3oETMc41qFZV3MXaKLw_bBU5Qi5b';
        
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
        
        function verifyInvitation() {
            const code = document.getElementById("inviteCodeInput").value.trim().toUpperCase();
            if (code === "KUWAIT2026") {
                activeDriverCode = code;
                document.getElementById("inviteOverlay").style.display = "none";
                document.getElementById("reportPanel").style.display = "flex";
                document.getElementById("driverBadge").innerText = `👤 راصد: ${code}`;
                initializeMap();
            }
        }
        
        function initializeMap() {
            map = L.map('map', { zoomControl: false }).setView([29.3759, 47.9774], 12);
            
            // 4️⃣ تم إصلاح رابط خريطة الشارع المفتوح لتظهر على المتصفح والآيفون فوراً
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    let lat = position.coords.latitude; let lng = position.coords.longitude;
                    L.circleMarker([lat, lng], { radius: 10, fillColor: '#00E5FF', color: '#FFF', weight: 3, fillOpacity: 1 }).addTo(map);
                });
            }
        }
        
        async function sendReportToServer(type) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async position => {
                    const lat = position.coords.latitude; const lng = position.coords.longitude;
                    const { error } = await supabaseClient.from('app_field_reports').insert([{ reporter_code: activeDriverCode, report_type: type, latitude: lat, longitude: lng }]);
                    if (!error) {
                        localPoints += 10; document.getElementById("pointsCounter").innerText = localPoints;
                        L.marker([lat, lng]).addTo(map).bindPopup(type).openPopup();
                    } else {
                        console.error("خطأ في إرسال البلاغ:", error.message);
                    }
                });
            }
        }
    </script>
</body>
</html>
